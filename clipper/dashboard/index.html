<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTA VI Clipper</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--fg:#e8e8ea;--mut:#9aa0aa;--ok:#3fb950;--warn:#d29922;--err:#f85149;--acc:#e83e8c}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{padding:14px 16px;border-bottom:1px solid #262a33;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0}h2{font-size:14px;margin:0 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
main{display:grid;gap:14px;padding:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
section{background:var(--card);border-radius:10px;padding:14px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:4px 6px;border-bottom:1px solid #262a33;vertical-align:top}
.pill{padding:1px 8px;border-radius:99px;font-size:12px;background:#262a33}
.ok{color:var(--ok)}.warn{color:var(--warn)}.err{color:var(--err)}.mut{color:var(--mut)}
.spark{display:flex;gap:2px;align-items:flex-end;height:40px}.spark i{flex:1;background:var(--acc);min-height:1px;border-radius:2px 2px 0 0}
button{background:#262a33;color:var(--fg);border:0;border-radius:6px;padding:3px 8px;cursor:pointer}
input{background:#0f1115;color:var(--fg);border:1px solid #333;border-radius:6px;padding:4px 8px}
</style></head><body>
<header><h1>GTA VI Clipper</h1><span id="mode" class="pill"></span><span id="budget" class="pill"></span>
</header>
<main>
<section><h2>YouTube Live</h2>
<form id="ytform" style="display:grid;gap:8px">
<input id="yturl" type="url" required placeholder="https://www.youtube.com/watch?v=… or youtube.com/@channel/live" style="width:100%">
<label class="mut" style="font-size:13px"><input id="ytperm" type="checkbox"> I own this stream or have the creator's explicit permission to capture and clip it</label>
<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" id="ytcheck">Check</button><button type="submit" style="background:var(--acc)">START</button></div>
<div id="ytmsg" class="mut" style="font-size:13px"></div>
</form>
<div id="ytsessions" style="margin-top:10px"></div></section>
<section><h2>Active captures</h2><div id="active" class="mut">none</div></section>
<section><h2>Streams</h2><table id="streams"></table></section>
<section><h2>Clips</h2><table id="clips"></table></section>
<section><h2>Publishing</h2><table id="jobs"></table></section>
<section><h2>Moments</h2><table id="moments"></table></section>
<section><h2>Events</h2><table id="events"></table></section>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cls=s=>/fail|error|reject|held/.test(s)?'err':/publish|dry_run|ready|capturing|ok|live/.test(s)?'ok':'warn';
function rows(el,cols,data,fmt){$(el).innerHTML='<tr>'+cols.map(c=>`<th>${c}</th>`).join('')+'</tr>'+
 data.map(r=>'<tr>'+fmt(r).map(v=>`<td>${v}</td>`).join('')+'</tr>').join('')}
async function republish(id){const r=await fetch(`/api/clips/${id}/publish`,{method:'POST'});alert(JSON.stringify(await r.json()))}
async function api(method,url,body){const r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
 let j={};try{j=await r.json()}catch(e){};return {ok:r.ok,status:r.status,j}}
function ytmsg(t,c){$('ytmsg').innerHTML=`<span class=${c}>${esc(t)}</span>`}
$('ytcheck').onclick=async()=>{ytmsg('checking…','mut');const r=await api('GET','/api/youtube/check?url='+encodeURIComponent($('yturl').value));
 if(!r.ok){ytmsg(r.j.detail||('HTTP '+r.status),'err');return}
 const i=r.j.info;ytmsg(`${r.j.ok?'ready':'not startable'} · ${i.status} · ${i.title||''} · ${i.handle||i.channel_id||''} · ${r.j.message}`,r.j.ok?'ok':'err')};
$('ytform').onsubmit=async e=>{e.preventDefault();if(!$('ytperm').checked){ytmsg('Confirm ownership/permission first.','err');return}
 ytmsg('validating and connecting…','mut');const r=await api('POST','/api/youtube/start',{url:$('yturl').value,permission_confirmed:true});
 if(r.ok){ytmsg(`started ${r.j.started}: ${r.j.title||''} (live check via ${r.j.method})`,'ok');tick()}else ytmsg(r.j.detail||('HTTP '+r.status),'err')};
async function stopStream(key){if(!confirm('Stop '+key+'?'))return;const r=await api('POST','/api/streams/'+encodeURIComponent(key)+'/stop');
 ytmsg(r.ok?'stopping '+key:(r.j.detail||'HTTP '+r.status),r.ok?'ok':'err');tick()}
async function tick(){
 const d=await (await fetch('/api/status')).json();
 $('mode').textContent='publish: '+d.publish_mode;
 $('budget').textContent=`AI ₹${d.budget.ai_spent_inr}/${d.budget.ai_cap_inr}`;
 $('active').innerHTML=d.active.length?d.active.map(a=>{const mx=Math.max(4,...a.last_scores.map(s=>s.score));
  return `<div><b>${esc(a.key)}</b> <span class=${cls(a.state)}>${esc(a.state)}</span> <button onclick="stopStream('${esc(a.key)}')">STOP</button>
  ${a.error?`<div class=err>${esc(a.error)}</div>`:''}<span class="mut">buffer ${a.buffer_s}s · ${a.segments} segs · ${a.chat_msgs} chat msgs · chat ${a.chat_connected?'<span class=ok>connected</span>':'<span class=warn>'+esc(a.chat_error||'off')+'</span>'}</span>
  <div class="spark">${a.last_scores.map(s=>`<i title="t=${s.t} score=${s.score}" style="height:${100*s.score/mx}%"></i>`).join('')}</div></div>`}).join(''):'none';
 $('ytsessions').innerHTML=(d.youtube_sessions||[]).map(s=>`<div style="font-size:13px"><b>${esc(s.channel)}</b> <span class=${cls(s.state)}>${esc(s.state)}</span>
  · reconnects ${s.reconnects} · <span class=mut>${esc((s.title||'').slice(0,50))}</span>${s.message?`<div class=warn>${esc(s.message)}</div>`:''}
  ${s.state!=='capturing'?`<button onclick="stopStream('${esc(s.key)}')">STOP</button>`:''}</div>`).join('');
 rows('streams',['stream','viewers','status'],d.streams,r=>[`${esc(r.platform)}:${esc(r.channel)}<br><span class=mut>${esc((r.title||'').slice(0,60))}</span>`,r.viewers??'',`<span class=${cls(r.status)}>${esc(r.status)}</span>`]);
 rows('clips',['#','title','status',''],d.clips,r=>[r.id,esc(r.title||r.stream_key)+(r.error?`<br><span class=err>${esc(r.error)}</span>`:''),`<span class=${cls(r.status)}>${esc(r.status)}</span>`,
  r.has_video?`<a href="/media/${r.id}" target=_blank>view</a> <button onclick="republish(${r.id})">publish</button>`:'']);
 rows('jobs',['clip','target','status','link'],d.jobs,r=>[r.clip_id,esc(r.target),`<span class=${cls(r.status)}>${esc(r.status)}</span>`+(r.error?`<br><span class=err>${esc(r.error)}</span>`:''),r.remote_url&&r.remote_url.startsWith('http')?`<a href="${esc(r.remote_url)}" target=_blank>open</a>`:'']);
 rows('moments',['#','stream','t','score','status'],d.moments,r=>[r.id,esc(r.stream_key),r.t.toFixed(1),r.score.toFixed(2),esc(r.status)]);
 rows('events',['time','source','message'],d.events,r=>[new Date(r.created_at*1000).toLocaleTimeString(),esc(r.source),`<span class=${r.level=='error'?'err':r.level=='warning'?'warn':''}>${esc(r.message)}</span>`]);
}
tick();setInterval(tick,3000);
</script></body></html>
